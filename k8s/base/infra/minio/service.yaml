apiVersion: v1
kind: Service
metadata:
  name: minio
  namespace: default
  labels:
    app: minio
    env: production
spec:
  # ClusterIP нужен, чтобы приложение ходило в MinIO по имени minio.
  type: ClusterIP
  # Селектор направляет трафик на Pod MinIO.
  selector:
    app: minio
  # 9000 — S3 API, 9001 — web console.
  ports:
    - name: api
      port: 9000
      targetPort: api
    - name: console
      port: 9001
      targetPort: console