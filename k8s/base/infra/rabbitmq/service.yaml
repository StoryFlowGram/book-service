apiVersion: v1
kind: Service
metadata:
  name: rabbitmq
  namespace: default
  labels:
    app: rabbitmq
    env: production
spec:
  # ClusterIP даёт стабильное имя rabbitmq для внутренних клиентов.
  type: ClusterIP
  # Селектор должен совпадать с labels в RabbitMQ Deployment.
  selector:
    app: rabbitmq
  # 5672 — AMQP, 15672 — management UI.
  ports:
    - name: amqp
      port: 5672
      targetPort: amqp
    - name: management
      port: 15672
      targetPort: management